{{define "base"}}
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{{block "title" .}}LanOps Tournament Manager{{end}}</title>
    <link rel="manifest" href="/manifest.webmanifest">
    <meta name="theme-color" content="#ffa500">
    <link rel="icon" type="image/png" href="/static/img/lanops.png">
    <link rel="apple-touch-icon" href="/static/img/lanops.png">
    <script src="https://unpkg.com/htmx.org@2.0.4/dist/htmx.min.js" integrity="sha384-HGfztofotfshcF7+8n44JQL2oJmowVChPTg48S+jvZoztPfvwD79OC/LTtG6dMp+" crossorigin="anonymous"></script>
    <script src="https://unpkg.com/htmx-ext-sse@2.2.2/sse.js" integrity="sha384-fw+eTlCc7suMV/1w/7fr2/PmwElUIt5i82bi+qTiLXvjRXZ2/FkiTNA/w0MhXnGI" crossorigin="anonymous"></script>
    <link rel="stylesheet" href="/static/css/main.css?v={{.AssetVersion}}">
    <meta name="htmx-config" content='{"defaultSwapStyle":"outerHTML"}'>
    <meta name="csrf-token" content="{{.CSRFToken}}">
</head>
<body>
    <nav class="navbar">
        <a href="/" class="navbar-brand">
            <img src="/static/img/lanops.png" alt="LanOps" class="brand-logo">
            <span class="brand-name">Tournament Manager</span>
        </a>
        <div class="navbar-links">
            <a href="/tournaments">Tournaments</a>
            <a href="/leaderboard">Leaderboard</a>
            {{if .UserID}}
                {{if .IsAdmin}}<a href="/admin">Admin</a>{{end}}
                <a href="/auth/logout" hx-post="/auth/logout" hx-target="body">Logout</a>
            {{else}}
                <a href="/auth/discord">Login with Discord</a>
            {{end}}
        </div>
    </nav>
    <main class="container">
        {{block "content" .}}{{end}}
    </main>
    <footer class="site-footer">
        <span>Built with Vodka and Hatred &mdash; <a href="https://github.com/th0rn0/lanops-tournament-manager" target="_blank" rel="noopener">GitHub</a></span>
    </footer>
    <script src="/static/js/bracket.js?v={{.AssetVersion}}"></script>
    <script src="/static/js/app.js?v={{.AssetVersion}}"></script>
</body>
</html>
{{end}}
